<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Projet Manager</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .login-container {
            max-width: 400px;
            margin: 100px auto;
            background: #fff;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .login-container h2 { text-align: center; margin-bottom: 1.5rem; color: var(--primary-color); }
        .error-msg { color: var(--danger-color); text-align: center; margin-bottom: 1rem; display: none; }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Projet Manager</h2>
        <div id="error-msg" class="error-msg">Identifiants incorrects</div>
        <form id="login-form">
            <div class="form-group">
                <label>Nom d'utilisateur</label>
                <input type="text" id="username" class="form-control" required>
            </div>
            <div class="form-group">
                <label>Mot de passe</label>
                <input type="password" id="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Se connecter</button>
        </form>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            const formData = new URLSearchParams();
            formData.append('username', username);
            formData.append('password', password);

            try {
                const response = await fetch('/api/auth/login/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData.toString()
                });

                if (response.ok) {
                    const data = await response.json();
                    localStorage.setItem('access_token', data.access_token);

                    // Fetch user info to store role
                    const meResp = await fetch('/api/auth/me/', {
                        headers: { 'Authorization': `Bearer ${data.access_token}` }
                    });
                    if (meResp.ok) {
                        const me = await meResp.json();
                        localStorage.setItem('user_role', me.role);
                        localStorage.setItem('user_name', me.username);
                        window.location.href = '/';
                    }
                } else {
                    document.getElementById('error-msg').style.display = 'block';
                }
            } catch (err) {
                console.error(err);
                document.getElementById('error-msg').style.display = 'block';
            }
        });
    </script>
</body>
</html>
